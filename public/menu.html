<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu | Sunny Kitchen</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
.dish-image {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 12px;
}
</style>
</head>
<body data-page="menu">

  <section class="section">
    <div class="container">
      <h1 class="section-title">Our menu</h1>
      <p class="section-sub">Cooked fresh to order. Filter by category, diet or spice level.</p>

      <div class="filters" id="categories"></div>
      <div class="filters">
        <input class="grow" id="search" placeholder="Search dishes..." maxlength="40" />
        <select id="vegOnly"><option value="">Veg and non-veg</option><option value="1">Veg only</option></select>
        <select id="maxSpice">
          <option value="">Any spice level</option>
          <option value="0">Not spicy</option>
          <option value="1">Mild</option>
          <option value="2">Medium</option>
          <option value="3">Hot</option>
        </select>
      </div>

      <div id="menuList"></div>
    </div>
  </section>

  <script src="/js/app.js"></script>
  <script>
    const CATEGORIES = [
  'All',
  'Starters',
  'Mains',
  'Biryani',
  'Breads',
  'Chinese',
  'Desserts',
  'Drinks'
];
    let category = 'All';
    let items = [];

    $('#categories').innerHTML = CATEGORIES.map((c) => `<button class="chip ${c === 'All' ? 'active' : ''}" data-cat="${c}">${c}</button>`).join('');

    function card(d) {
  return `
    <article class="dish">

      <img src="${esc(d.image)}" alt="${esc(d.name)}" class="dish-image">
          <div class="dish-top">
            <span class="emoji">${esc(d.emoji)}</span>
            <span>${d.popular ? '<span class="tag">Popular</span> ' : ''}<span class="diet ${d.veg ? '' : 'nonveg'}" title="${d.veg ? 'Vegetarian' : 'Non-vegetarian'}"></span></span>
          </div>
          <h3>${esc(d.name)}</h3>
          <p>${esc(d.description)}</p>
          <div class="dish-foot">
            <div><span class="price">${rupee(d.price)}</span><br><span class="spice">${spiceLabel(d.spice)}</span></div>
            <button class="btn btn-sm" data-id="${esc(d._id)}">Add to cart</button>
          </div>
        </article>`;
    }

    function render() {
      if (!items.length) { $('#menuList').innerHTML = '<p class="empty">No dishes match your filters.</p>'; return; }
      const groups = {};
      items.forEach((d) => (groups[d.category] ||= []).push(d));
      $('#menuList').innerHTML = CATEGORIES.filter((c) => groups[c]).map((c) =>
        `<h2 class="category-title">${c}</h2><div class="grid">${groups[c].map(card).join('')}</div>`).join('');
    }

    async function load() {
      const params = new URLSearchParams();
      if (category !== 'All') params.set('category', category);
      if ($('#vegOnly').value) params.set('veg', $('#vegOnly').value);
      if ($('#maxSpice').value !== '') params.set('maxSpice', $('#maxSpice').value);
      if ($('#search').value.trim()) params.set('q', $('#search').value.trim());
      try {
        items = await api('/api/menu?' + params.toString());

console.log("Total dishes received:", items.length);
console.log("Dish names:", items.map(d => d.name));

render();
      } catch {
        $('#menuList').innerHTML = '<p class="empty">Could not load the menu. Please try again.</p>';
      }
    }

    $('#categories').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-cat]');
      if (!btn) return;
      category = btn.dataset.cat;
      $$('#categories .chip').forEach((c) => c.classList.toggle('active', c === btn));
      load();
    });
    $('#vegOnly').addEventListener('change', load);
    $('#maxSpice').addEventListener('change', load);
    let timer;
    $('#search').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 250); });

    $('#menuList').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id]');
      if (!btn) return;
      const dish = items.find((d) => d._id === btn.dataset.id);
      if (dish) addToCart(dish);
    });

    load();
  </script>
</body>
</html>
